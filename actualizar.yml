name: Actualizar clasificación

on:
  schedule:
    - cron: "0 */6 * * *"     # cada 6 horas
  workflow_dispatch:           # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Bajar tablas y generar la app
        env:
          WIKI_CONTACTO: ${{ secrets.WIKI_CONTACTO }}
        run: |
          python selecciones.py tablas
          python selecciones.py web
      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza clasificación"
            git pull --rebase -X theirs origin main
            git push
          fi
