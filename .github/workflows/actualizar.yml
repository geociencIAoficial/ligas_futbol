name: Actualizar clasificación

on:
  schedule:
    - cron: "0 */6 * * *"     # cada 6 horas
  workflow_dispatch:           # también se puede lanzar a mano desde la pestaña Actions
  push:                        # y se lanza solo al subir cambios al código o al CSV
    paths:
      - "clasificacion.py"
      - "selecciones.py"
      - "datos_manuales.csv"

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Bajar tablas
        env:
          WIKI_CONTACTO: ${{ secrets.WIKI_CONTACTO }}
        run: |
          python selecciones.py tablas
      - name: Histórico (solo baja lo que falta)
        continue-on-error: true
        env:
          WIKI_CONTACTO: ${{ secrets.WIKI_CONTACTO }}
        run: python selecciones.py historico
      - name: Generar la app
        run: python selecciones.py web
      - name: Publicar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs datos_historicos.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiza clasificación"
            git pull --rebase -X theirs origin main
            git push
          fi
